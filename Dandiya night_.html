<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dandiya night?</title>
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14061f;
    --teal: #12a89a;
    --ink: #f5eeff;
    --mark: #ffb627;
    --yes: #d6336c;
    --yes-hover: #ee4b85;
    --no-bg: transparent;
    --no-hover: #2a1a4d;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background: radial-gradient(ellipse at 85% 0%, #2b1466 0%, transparent 55%), linear-gradient(#060215 0%, #14061f 65%, #241040 100%);
    color: var(--ink);
    font-family: "Yatra One", Georgia, "Times New Roman", serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2rem;
    padding: 1rem;
    text-align: center;
  }
  h1 {
    margin: 0;
    font-weight: 400;
    font-size: clamp(1.7rem, 6vw, 3.2rem);
    line-height: 1.2;
    max-width: 18ch;
  }
  mark {
    color: inherit;
    background: linear-gradient(transparent 55%, var(--mark) 55%, var(--mark) 92%, transparent 92%);
    padding: 0 .15em;
    font-weight: 400;
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1.25rem;
    flex-wrap: wrap;
  }
  button {
    font: inherit;
    font-weight: 400;
    cursor: pointer;
    border-radius: 999px;
    border: 3px solid var(--yes);
    transition: transform .2s ease, background-color .2s ease, box-shadow .2s ease, top .25s ease, left .25s ease;
  }
  button:focus-visible { outline: 3px solid var(--mark); outline-offset: 3px; }
  #yes {
    --glow: 0;
    background: var(--yes);
    color: #fff;
    font-size: 1.4rem;
    padding: .4em 1.6em;
    transition: transform .2s ease, background-color .2s ease, box-shadow .2s ease, font-size .25s ease;
    box-shadow: 0 0 calc(var(--glow) * 1px) calc(var(--glow) * .25px) rgba(255, 182, 39, .85),
                0 0 calc(var(--glow) * 2px) rgba(214, 51, 108, .7);
  }
  #yes:hover {
    background: var(--yes-hover);
    border-color: var(--yes-hover);
    transform: scale(1.06);
  }
  #yes.hyped { animation: pulse .7s ease-in-out infinite alternate; border-color: var(--mark); }
  @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.07); } }
  #no {
    background: var(--no-bg);
    color: var(--ink);
    border-color: var(--ink);
    font-size: 1.4rem;
    padding: .4em 1.6em;
  }
  #no:hover { background: var(--no-hover); transform: scale(1.06); }
  #no.run { position: fixed; z-index: 5; margin: 0; }

  /* Torana-style borders: a hanging row of pennants, top and bottom */
  body::before, body::after {
    content: ""; position: fixed; left: 0; right: 0; height: 18px; z-index: 1;
    background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='18' viewBox='0 0 120 18'><rect width='120' height='3' fill='%23ffb627'/><polygon points='2,3 38,3 20,17' fill='%23ffb627'/><polygon points='42,3 78,3 60,17' fill='%23d6336c'/><polygon points='82,3 118,3 100,17' fill='%2312a89a'/><circle cx='20' cy='9' r='2' fill='%2314061f'/><circle cx='60' cy='9' r='2' fill='%2314061f'/><circle cx='100' cy='9' r='2' fill='%2314061f'/></svg>") repeat-x center top / 120px 18px;
  }
  body::before { top: env(safe-area-inset-top, 0px); }
  body::after { bottom: env(safe-area-inset-bottom, 0px); transform: scaleY(-1); }
  .hero { display: flex; flex-direction: column; align-items: center; gap: .9rem; }
  .kicker { color: var(--mark); font-size: .95rem; letter-spacing: .3em; opacity: .9; }
  .sticks { width: 84px; height: 42px; transform-origin: 50% 50%; animation: sway 3s ease-in-out infinite alternate; }
  .yay .sticks { animation-duration: .5s; }
  @keyframes sway { from { transform: rotate(-6deg); } to { transform: rotate(6deg); } }
  .hero, .row { position: relative; z-index: 2; }

  /* Night sky */
  .sky { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .star { position: absolute; border-radius: 50%; background: #fff; opacity: .3; animation: twinkle var(--d) ease-in-out var(--dl) infinite; }
  .star.gold { background: var(--mark); }
  @keyframes twinkle { 0%, 100% { opacity: .15; transform: scale(.7); } 50% { opacity: 1; transform: scale(1.35); } }
  .moon {
    position: absolute; right: 7vw; top: calc(env(safe-area-inset-top, 0px) + 34px);
    width: clamp(48px, 9vw, 80px); aspect-ratio: 1; border-radius: 50%; transform: rotate(-20deg);
    box-shadow: inset -.32em -.1em 0 0 #ffeeb5, 0 0 40px 6px rgba(255, 238, 181, .18);
    font-size: clamp(48px, 9vw, 80px) ;
  }

  /* Cat */
  .cat { width: 104px; height: auto; overflow: visible; }
  .cat .tail { transform-origin: 100px 108px; animation: wag 1.4s ease-in-out infinite alternate; }
  @keyframes wag { from { transform: rotate(-14deg); } to { transform: rotate(16deg); } }
  .cat .eyes { transform-origin: 70px 52px; transition: transform .3s ease; }
  .cat .blink { transform-origin: 70px 52px; animation: blink 4s infinite; }
  @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
  .cat .m-sad, .cat .brows, .cat .tear, .cat .eyes-happy, .cat .m-happy, .cat .blush { display: none; }
  .cat.sad .m-hope, .cat.happy .m-hope, .cat.happy .eyes { display: none; }
  .cat.sad .m-sad, .cat.sad .brows, .cat.cry .tear, .cat.happy .eyes-happy, .cat.happy .m-happy, .cat.happy .blush { display: inline; }
  .cat.sad .eyes { transform: scale(1.25); }
  .cat .tear { animation: drip 1.2s ease-in infinite; }
  @keyframes drip { from { transform: translateY(0); opacity: 1; } to { transform: translateY(16px); opacity: 0; } }
  .yay .cat { animation: hop .5s ease-in-out infinite alternate; }
  @keyframes hop { to { transform: translateY(-10px); } }
  .by { display: block; margin-top: .7rem; font-size: .42em; color: var(--mark); letter-spacing: .08em; }

  @media (prefers-reduced-motion: reduce) { .sticks { animation: none; } .star, .cat, .cat * { animation: none !important; } .star { opacity: .7; } }
  @media (prefers-reduced-motion: reduce) {
    button { transition: background-color .2s ease; }
    #yes.hyped { animation: none; }
  }
</style>
</head>
<body>
  <div class="sky" id="sky" aria-hidden="true"><div class="moon"></div></div>
  <div class="hero">
    <div class="kicker">॥ नवरात्रि ॥</div>
    <svg class="sticks" viewBox="0 0 120 60" aria-hidden="true" fill="none" stroke-linecap="round">
      <line x1="16" y1="52" x2="104" y2="8" stroke="#ffb627" stroke-width="7"/>
      <line x1="16" y1="52" x2="104" y2="8" stroke="#f5eeff" stroke-width="7" stroke-dasharray="3 13" stroke-dashoffset="-6"/>
      <line x1="16" y1="8" x2="104" y2="52" stroke="#d6336c" stroke-width="7"/>
      <line x1="16" y1="8" x2="104" y2="52" stroke="#f5eeff" stroke-width="7" stroke-dasharray="3 13" stroke-dashoffset="-6"/>
    </svg>
    <svg class="cat" id="cat" viewBox="0 0 140 130" aria-hidden="true">
      <path class="tail" d="M100 108 Q136 104 128 66" fill="none" stroke="#f4a340" stroke-width="11" stroke-linecap="round"/>
      <ellipse cx="70" cy="106" rx="34" ry="22" fill="#f4a340"/>
      <ellipse cx="55" cy="124" rx="11" ry="6" fill="#f9c37a"/><ellipse cx="85" cy="124" rx="11" ry="6" fill="#f9c37a"/>
      <polygon points="42,38 44,8 66,26" fill="#f4a340"/><polygon points="98,38 96,8 74,26" fill="#f4a340"/>
      <polygon points="47,30 48,16 58,26" fill="#ffb3c1"/><polygon points="93,30 92,16 82,26" fill="#ffb3c1"/>
      <circle cx="70" cy="54" r="32" fill="#f4a340"/>
      <path d="M70 23v9M60 25l2 8M80 25l-2 8" stroke="#d9822b" stroke-width="3" stroke-linecap="round"/>
      <g class="eyes"><g class="blink"><ellipse cx="57" cy="52" rx="4.5" ry="6" fill="#2a1200"/><ellipse cx="83" cy="52" rx="4.5" ry="6" fill="#2a1200"/><circle cx="58.6" cy="49.5" r="1.7" fill="#fff"/><circle cx="84.6" cy="49.5" r="1.7" fill="#fff"/></g></g>
      <path class="eyes-happy" d="M51 54Q57 46 63 54M77 54Q83 46 89 54" fill="none" stroke="#2a1200" stroke-width="3" stroke-linecap="round"/>
      <path class="brows" d="M49 42L64 37M91 42L76 37" stroke="#7a3b12" stroke-width="2.5" stroke-linecap="round"/>
      <ellipse class="blush" cx="47" cy="62" rx="6" ry="3.5" fill="#ff6f91" opacity=".55"/><ellipse class="blush" cx="93" cy="62" rx="6" ry="3.5" fill="#ff6f91" opacity=".55"/>
      <polygon points="66,60 74,60 70,65" fill="#ff7a93"/>
      <path class="m-hope" d="M62 68Q66 73 70 66Q74 73 78 68" fill="none" stroke="#7a3b12" stroke-width="2" stroke-linecap="round"/>
      <path class="m-sad" d="M62 74Q70 65 78 74" fill="none" stroke="#7a3b12" stroke-width="2" stroke-linecap="round"/>
      <path class="m-happy" d="M60 66Q70 82 80 66Z" fill="#8a2b2b" stroke="#7a3b12" stroke-width="2" stroke-linejoin="round"/>
      <path d="M40 62L22 58M40 66L22 69M100 62L118 58M100 66L118 69" stroke="#fff" stroke-opacity=".7" stroke-width="1.3" stroke-linecap="round"/>
      <ellipse class="tear" cx="52" cy="63" rx="2.5" ry="4" fill="#8fd8ff"/>
    </svg>
    <h1 id="q">Wanna go to <mark>dandiya night</mark> w me?</h1>
  </div>
  <div class="row" id="row">
    <button id="yes">YES</button>
    <button id="no">NO</button>
  </div>

<script>
  var yes = document.getElementById("yes");
  var no = document.getElementById("no");
  var q = document.getElementById("q");
  var row = document.getElementById("row");
  var cat = document.getElementById("cat");
  var msgs = [
    "Are you sure? \uD83E\uDD7A",
    "Think again...",
    "Pleeease? It'll be the best <mark>dandiya night</mark> \uD83E\uDD7A",
    "Last chance... don't break this kitty's heart \uD83D\uDC94",
    "Okay, now you can't say NO \uD83D\uDE3C"
  ];
  var clicks = 0;
  var running = false;
  var done = false;
  var yesSize = 1.4;          // rem
  var glow = 0;
  var target = { x: 0, y: 0 };
  var mouse = { x: -999, y: -999 };
  var DANGER = 130;           // px: how close the cursor may get before NO flees

  // largest font-size (rem) YES is ever allowed to reach on this screen
  function maxYesRem() {
    var cap = Math.min((window.innerWidth - 32) / 5.2, window.innerHeight * 0.5 / 2) / 16;
    return Math.max(cap, 1.4);
  }

  // Keep-out zones: the text block and YES, both as they are now AND as they will be at full size
  var zones = [];
  function rectOf(el) { var r = el.getBoundingClientRect(); return { l: r.left, t: r.top, r: r.right, b: r.bottom }; }
  function union(a, b) {
    return { l: Math.min(a.l, b.l), t: Math.min(a.t, b.t), r: Math.max(a.r, b.r), b: Math.max(a.b, b.b) };
  }
  function computeZones() {
    var hero = document.querySelector(".hero");
    var cur = [rectOf(hero), rectOf(yes)];
    var oldSize = yes.style.fontSize, oldTr = yes.style.transition;
    yes.style.transition = "none";
    yes.style.fontSize = maxYesRem() + "rem";     // temporarily measure the layout at max size
    var mx = [rectOf(hero), rectOf(yes)];
    yes.style.fontSize = oldSize;
    void yes.offsetWidth;                          // flush layout before re-enabling the transition
    yes.style.transition = oldTr;
    zones = [union(cur[0], mx[0]), union(cur[1], mx[1])];
  }

  // YES grows, glows and pulses more each time it's called (capped so it always fits on screen)
  function growYes(step) {
    yesSize = Math.min(yesSize + step, maxYesRem());
    yes.style.fontSize = yesSize + "rem";
    if (running) {
      glow = Math.min(glow + 3, 60);
      yes.style.setProperty("--glow", glow);
      yes.classList.add("hyped");
    }
  }

  function overlapsYes(x, y, w, h) {
    var m = 24; // keep a clear gap around text and YES
    for (var i = 0; i < zones.length; i++) {
      var z = zones[i];
      if (x < z.r + m && x + w > z.l - m && y < z.b + m && y + h > z.t - m) return true;
    }
    return false;
  }

  function pickSpot() {
    var pad = 24;
    var w = no.offsetWidth, h = no.offsetHeight;
    var maxX = Math.max(pad, window.innerWidth - w - pad);
    var maxY = Math.max(pad, window.innerHeight - h - pad);
    var best = null;
    for (var i = 0; i < 80; i++) {
      var x = Math.round(pad + Math.random() * (maxX - pad));
      var y = Math.round(pad + Math.random() * (maxY - pad));
      if (overlapsYes(x, y, w, h)) continue;
      best = { x: x, y: y };
      // prefer spots well away from the cursor (relax after 50 tries)
      var dx = (x + w / 2) - mouse.x, dy = (y + h / 2) - mouse.y;
      if (i > 50 || Math.sqrt(dx * dx + dy * dy) > DANGER * 2) break;
    }
    if (best) return best;
    // random tries failed: scan the screen for any free spot
    for (var gy = pad; gy <= maxY; gy += 16) {
      for (var gx = pad; gx <= maxX; gx += 16) {
        if (!overlapsYes(gx, gy, w, h)) return { x: gx, y: gy };
      }
    }
    return { x: pad, y: pad };
  }

  function hop(fromChase) {
    var p = pickSpot();
    target = p;
    no.style.left = p.x + "px";
    no.style.top = p.y + "px";
    if (fromChase) growYes(0.25);
  }

  function startRunning() {
    var r = no.getBoundingClientRect();
    no.style.left = r.left + "px";
    no.style.top = r.top + "px";
    no.classList.add("run");
    running = true;
    computeZones();
    growYes(0.4);
    hop(false);
    setInterval(function () { if (!done) hop(false); }, 2000);
  }

  // Cursor / finger gets near NO -> it runs away
  function nearNo(px, py) {
    var w = no.offsetWidth, h = no.offsetHeight;
    var dx = Math.max(target.x - px, 0, px - (target.x + w));
    var dy = Math.max(target.y - py, 0, py - (target.y + h));
    return Math.sqrt(dx * dx + dy * dy) < DANGER;
  }

  var lastDodge = 0;
  function onMove(e) {
    mouse.x = e.clientX; mouse.y = e.clientY;
    if (!running || done) return;
    var now = Date.now();
    if (nearNo(mouse.x, mouse.y) && now - lastDodge > 180) {
      lastDodge = now;
      hop(true);
    }
  }
  document.addEventListener("pointermove", onMove);
  document.addEventListener("pointerdown", function (e) {
    mouse.x = e.clientX; mouse.y = e.clientY;
    if (running && !done && nearNo(e.clientX, e.clientY)) {
      e.preventDefault();
      hop(true);
    }
  });

  // NO clicks: first 5 just grow YES; the 5th switches on un-chasable mode
  no.addEventListener("click", function (e) {
    if (running) { e.preventDefault(); hop(true); return; }
    clicks++;
    q.innerHTML = msgs[Math.min(clicks, msgs.length) - 1];
    cat.setAttribute("class", clicks >= 3 ? "cat sad cry" : "cat sad");
    growYes(yesSize * 0.3);   // compounding: every NO press makes YES noticeably bigger
    if (clicks >= 5) startRunning();
  });

  yes.addEventListener("click", function () {
    done = true;
    document.body.classList.add("yay");
    row.style.display = "none";
    no.style.display = "none";
    cat.setAttribute("class", "cat happy");
    q.innerHTML = "Yay! Thanks for agreeing \uD83D\uDC9B<br>See you at <mark>dandiya night</mark> \uD83D\uDC83\uD83D\uDD7A <small class=\"by\">~by AD</small>";
  });

  window.addEventListener("resize", function () { if (running && !done) { computeZones(); hop(false); } });

  // Twinkling stars
  (function () {
    var sky = document.getElementById("sky");
    for (var i = 0; i < 90; i++) {
      var s = document.createElement("i");
      var size = 1 + Math.random() * 2.2;
      s.className = "star" + (Math.random() < 0.18 ? " gold" : "");
      s.style.cssText = "left:" + (Math.random() * 100).toFixed(1) + "%;top:" + (Math.random() * 100).toFixed(1) + "%;" +
        "width:" + size.toFixed(1) + "px;height:" + size.toFixed(1) + "px;" +
        "--d:" + (1.6 + Math.random() * 3).toFixed(1) + "s;--dl:-" + (Math.random() * 4).toFixed(1) + "s";
      sky.appendChild(s);
    }
  })();
</script>
</body>
</html>
